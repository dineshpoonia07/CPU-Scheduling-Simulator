<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU Scheduling Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><i class="core"></i>CPU<small>Scheduling Simulator</small></div>
    <nav id="nav" aria-label="Algorithms"></nav>
  </aside>

  <main>
    <header class="hero">
      <h1 id="title"></h1>
      <p id="desc"></p>
    </header>

    <section class="panel" id="inputPanel">
      <h2>Processes</h2>
      <div class="scroll">
        <table>
          <thead id="inHead"></thead>
          <tbody id="inBody"></tbody>
        </table>
      </div>
      <div class="row">
        <label id="qWrap" class="hidden">Time quantum <input type="number" id="quantum" value="2" min="1" step="1"></label>
        <button id="addBtn" class="ghost">Add process</button>
        <button id="resetBtn" class="ghost">Load sample</button>
        <button id="runBtn" class="solid">Run simulation</button>
      </div>
      <p id="error" class="error" role="alert"></p>
    </section>

    <section id="result" class="panel hidden">
      <h2>Gantt chart</h2>
      <div class="scroll"><div id="gantt" class="gantt"></div></div>
      <h2>Results</h2>
      <div class="scroll">
        <table>
          <thead id="resHead"></thead>
          <tbody id="resBody"></tbody>
        </table>
      </div>
      <div class="avgs" id="avgs"></div>
      <p class="note" id="resNote"></p>
    </section>

    <section id="compare" class="panel hidden">
      <h2>Comparison</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Algorithm</th><th>Average CT</th><th>Average TAT</th><th>Average WT</th><th>Average RT</th></tr></thead>
          <tbody id="cmpBody"></tbody>
        </table>
      </div>
      <p class="note">The highlighted row has the lowest average waiting time.</p>
    </section>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
